services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    container_name: meshpoke-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: meshpoke_dev
      POSTGRES_USER: meshpoke
      POSTGRES_PASSWORD: meshpoke_dev_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshpoke -d meshpoke_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meshpoke-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
