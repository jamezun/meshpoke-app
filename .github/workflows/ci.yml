name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: install / typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # ubuntu-latest runners have Docker — Testcontainers spins PostGIS+Redis
      - name: Test (integration, Testcontainers)
        run: pnpm test

      - name: Build
        run: pnpm build

  flutter:
    name: flutter analyze / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Placeholder until apps/mobile exists (M5): hashFiles() is step-level only,
    # so every step self-skips while pubspec.yaml is absent.
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        if: hashFiles('apps/mobile/pubspec.yaml') != ''
        with:
          channel: stable
          cache: false

      - name: Analyze
        if: hashFiles('apps/mobile/pubspec.yaml') != ''
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        if: hashFiles('apps/mobile/pubspec.yaml') != ''
        working-directory: apps/mobile
        run: flutter test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f compose.e2e.yml up -d --wait
      - name: migrate + seed
        run: |
          pnpm --filter @meshpoke/shared build
          pnpm --filter @meshpoke/api exec tsx src/db/migrate.ts
          pnpm --filter @meshpoke/api exec tsx scripts/e2e-seed.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:15432/meshpoke_e2e
      - run: pnpm --filter @meshpoke/web exec playwright install --with-deps chromium
      - run: pnpm --filter @meshpoke/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 3
      - name: teardown
        if: always()
        run: docker compose -f compose.e2e.yml down -v
