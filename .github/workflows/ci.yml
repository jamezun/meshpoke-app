name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: install / typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # ubuntu-latest runners have Docker — Testcontainers spins PostGIS+Redis
      - name: Test (integration, Testcontainers)
        run: pnpm test

      - name: Build
        run: pnpm build

  flutter:
    name: flutter analyze / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Placeholder until apps/mobile exists (M5): skip gracefully
    if: hashFiles('apps/mobile/pubspec.yaml') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test
