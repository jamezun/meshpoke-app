resolver 127.0.0.11 valid=10s ipv6=off;
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # SPA fallback — no file extensions in routes
  location / {
    try_files $uri $uri/ /index.html;
  }
  # long-cache built assets
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # proxy API calls so web only needs its own origin
  # variable + resolver: api hostname resolves at request time (container may restart)
  location /v1/ {
    set $api_upstream http://meshpoke-api:8080;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
