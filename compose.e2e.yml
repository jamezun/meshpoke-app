# E2E stack: PostGIS + Redis (fixed local secrets — never production).
# Auth: sessions are minted locally with the shared JWT secret (no GoTrue container — see apps/web/e2e/auth.setup.ts).
services:
  e2e-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: meshpoke_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/e2e-init.sql:/docker-entrypoint-initdb.d/10-auth.sql:ro
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meshpoke_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
  e2e-redis:
    image: redis:7
    ports: ["16379:6379"]
